<svg width="800" height="960" viewBox="0 0 800 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle warm ivory background with architectural texture -->
  <rect width="800" height="960" fill="#F7F6F2"/>
  <rect x="24" y="24" width="752" height="912" fill="#FFFFFF" stroke="#DDE2E9" stroke-width="1.5"/>
  
  <!-- Architectural grid guidelines -->
  <line x1="24" y1="180" x2="776" y2="180" stroke="#F0EFEA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="24" y1="480" x2="776" y2="480" stroke="#F0EFEA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="24" y1="740" x2="776" y2="740" stroke="#F0EFEA" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="24" x2="400" y2="936" stroke="#F0EFEA" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Minimalist stylized architectural avatar silhouette -->
  <circle cx="400" cy="360" r="130" fill="#F0EFEA" stroke="#DDE2E9" stroke-width="1.5"/>
  <circle cx="400" cy="320" r="60" fill="#DCE2EC"/>
  <path d="M295 460 C295 400 505 400 505 460 Z" fill="#DCE2EC"/>

  <!-- Editorial badge -->
  <rect x="240" y="560" width="320" height="36" rx="2" fill="#E8EEF7" stroke="#DDE2E9"/>
  <text x="400" y="583" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#496DA8" text-anchor="middle" letter-spacing="1.5">RESERVED: PROFESSIONAL PORTRAIT</text>
  
  <!-- Primary replacement instructions -->
  <text x="400" y="650" font-family="'Newsreader', Georgia, serif" font-size="24" font-weight="500" fill="#17243A" text-anchor="middle">Yajash Khamar</text>
  <text x="400" y="680" font-family="'Inter', sans-serif" font-size="14" fill="#667085" text-anchor="middle">To display your real photograph, place your image at:</text>
  
  <rect x="220" y="705" width="360" height="38" rx="2" fill="#F7F6F2" stroke="#DDE2E9"/>
  <text x="400" y="729" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#17243A" text-anchor="middle">public/images/portrait.jpg</text>
  
  <text x="400" y="785" font-family="'Inter', sans-serif" font-size="13" fill="#667085" text-anchor="middle">Recommended Aspect Ratio: 4:5 • Natural Lighting</text>
  <text x="400" y="810" font-family="'Inter', sans-serif" font-size="12" fill="#496DA8" text-anchor="middle">Computer Engineering Undergrad • LJU Ahmedabad</text>
  
  <!-- Bottom architectural corner markers -->
  <circle cx="390" cy="880" r="3" fill="#496DA8"/>
  <circle cx="400" cy="880" r="3" fill="#496DA8"/>
  <circle cx="410" cy="880" r="3" fill="#496DA8"/>
</svg>
